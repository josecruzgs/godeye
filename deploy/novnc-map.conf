# → /etc/nginx/conf.d/godeye-vnc-map.conf
#
# Va en conf.d y no en el sitio porque `map` es directiva de contexto http, y
# porque conf.d se incluye solo: no hay que tocar el archivo del sitio, que
# certbot reescribe.
#
# El websocket de noVNC solo se levanta si Connection dice "upgrade" en las
# peticiones que lo piden y "close" en las que no: mandar "upgrade" siempre
# confunde al servidor de archivos de websockify.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
