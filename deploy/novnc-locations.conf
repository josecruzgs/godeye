# → /etc/nginx/snippets/godeye-vnc.conf
# Se enchufa con una línea dentro del server block:  include snippets/godeye-vnc.conf;
#
# Pantalla del VPS (noVNC) — lo que abre el botón de la barra superior.
#
# AdsPower corre contra una pantalla virtual que nadie ve; esto la acerca al
# mismo dominio para no depender de un túnel SSH cada vez que hay que mirar por
# qué se rompió una tarea.
#
# Es un escritorio con todas las sesiones abiertas, así que no puede quedar
# suelto: auth_request le pregunta a la app por CADA petición —el HTML, los
# assets y el websocket— y solo pasa quien tenga sesión de admin.

location = /api/vnc/auth {
    internal;
    proxy_pass http://127.0.0.1:3001;
    # La subpetición no lleva cuerpo; sin vaciar Content-Length, Node se queda
    # esperando un body que nunca llega.
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
}

location /novnc/ {
    auth_request /api/vnc/auth;
    # Sin esto el navegador muestra el 401 crudo de nginx en vez de llevar a
    # iniciar sesión.
    error_page 401 403 = @novnc_login;

    # La barra final del proxy_pass es la que recorta el prefijo: /novnc/vnc.html
    # llega a websockify como /vnc.html, que es como sirve sus archivos.
    proxy_pass http://127.0.0.1:6080/;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;

    # Una pestaña se deja abierta mirando una campaña larga: con el default de
    # 60s el escritorio se congela cada minuto de quietud.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location @novnc_login {
    return 302 /login?next=/vnc;
}
