# Nginx delante de Next.js. Copiar a /etc/nginx/sites-available/godeye,
# reemplazar yoconjulieta.iagent.mx y enlazar en sites-enabled.
#
# Next no se expone directo a internet a propósito: nginx absorbe peticiones
# malformadas, conexiones lentas y el ruido de escaneo, y deja al servidor
# dedicado a renderizar.

# Freno de fuerza bruta en el login, además del que hace la app. Este corta
# antes de que la petición llegue a Node.
limit_req_zone $binary_remote_addr zone=godeye_login:10m rate=12r/m;

# El websocket de noVNC solo se levanta si la cabecera Connection dice
# "upgrade" en las peticiones que lo piden y "close" en las que no: mandar
# "upgrade" siempre confunde al servidor de archivos de websockify.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name yoconjulieta.iagent.mx;

    # certbot reescribe este bloque para agregar el 443 con el certificado.

    client_max_body_size 25m;

    # Las capturas y subidas de la automatización pueden tardar; el default de
    # 60s corta respuestas legítimas a la mitad.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # $proxy_add_x_forwarded_for es lo que hace que la app vea la IP real del
    # visitante: sin esto todas las peticiones parecen venir de 127.0.0.1 y el
    # límite de intentos del login se aplicaría a todo el mundo junto.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/auth/login {
        limit_req zone=godeye_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3001;
    }

    # -----------------------------------------------------------------------
    # Pantalla del VPS (noVNC) — el botón de la barra superior del panel.
    #
    # AdsPower corre contra una pantalla virtual que nadie ve; esto la acerca
    # al mismo dominio para no depender de un túnel SSH cada vez que hay que
    # mirar por qué se rompió una tarea.
    #
    # Es un escritorio con todas las sesiones abiertas, así que no puede quedar
    # suelto: auth_request le pregunta a la app por CADA petición —el HTML, los
    # assets y el websocket— y solo pasa quien tenga sesión de admin.
    # -----------------------------------------------------------------------
    location = /api/vnc/auth {
        internal;
        proxy_pass http://127.0.0.1:3001;
        # La subpetición no lleva cuerpo; sin vaciar Content-Length, Node se
        # queda esperando un body que nunca llega.
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location /novnc/ {
        auth_request /api/vnc/auth;
        # Sin esto el navegador muestra el 401 crudo de nginx en vez de llevar
        # a iniciar sesión.
        error_page 401 403 = @novnc_login;

        # La barra final del proxy_pass es la que recorta el prefijo: /novnc/
        # vnc.html llega a websockify como /vnc.html, que es como sirve sus
        # archivos.
        proxy_pass http://127.0.0.1:6080/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;

        # Una pestaña se deja abierta mirando una campaña larga: con el default
        # de 60s el escritorio se congela cada minuto de quietud.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location @novnc_login {
        return 302 /login?next=/vnc;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;

        # Sin esto nginx acumula la respuesta entera antes de mandarla y las
        # páginas que usan streaming/Suspense aparecen de golpe al final.
        proxy_buffering off;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
